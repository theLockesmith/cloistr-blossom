stages:
  - test
  - build
  - docker
  - sync

include:
  - project: 'coldforge/ci-templates'
    ref: main
    file: '/templates/cloistr-rules.yml'
  - project: 'coldforge/ci-templates'
    ref: main
    file: '/templates/go-test.yml'
  - project: 'coldforge/ci-templates'
    ref: main
    file: '/templates/kaniko-build.yml'

variables:
  GO_VERSION: "1.25"
  GOPRIVATE: "git.aegis-hq.xyz"
  GOINSECURE: "git.aegis-hq.xyz"

# Cache Go modules between jobs
.go-cache: &go-cache
  cache:
    key: go-modules-${CI_COMMIT_REF_SLUG}
    paths:
      - .go/pkg/mod/
    policy: pull-push

# Test stage - run on all branches
test:
  stage: test
  image: golang:${GO_VERSION}-bookworm
  <<: *go-cache
  variables:
    GOPATH: ${CI_PROJECT_DIR}/.go
    CGO_ENABLED: "1"
  before_script:
    - apt-get update && apt-get install -y gcc libc6-dev
  script:
    - go mod download
    - go test -v ./...
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "master"
    - if: $CI_COMMIT_BRANCH == "main"

lint:
  extends: [.go-lint, .cloistr-rules]

# Build stage - build binary
build:
  stage: build
  image: golang:${GO_VERSION}-bookworm
  <<: *go-cache
  variables:
    GOPATH: ${CI_PROJECT_DIR}/.go
    CGO_ENABLED: "1"
  before_script:
    - apt-get update && apt-get install -y gcc libc6-dev
  script:
    - go mod download
    - go build -o blossom ./cmd/api
  artifacts:
    paths:
      - blossom
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
    - if: $CI_COMMIT_BRANCH == "main"

# Docker build - build and push container image
docker:
  extends: .kaniko-build
  stage: docker

# Sync with upstream (manual trigger)
sync-upstream:
  stage: sync
  image: alpine/git
  variables:
    GIT_STRATEGY: clone
  before_script:
    - git config --global user.email "ci@coldforge.xyz"
    - git config --global user.name "Coldforge CI"
  script:
    - git remote add upstream https://github.com/sebdeveloper6952/blossom-server.git || true
    - git fetch upstream
    - git checkout master
    - git merge upstream/master --no-edit || echo "Merge conflict - manual resolution required"
    - git push origin master
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual
  allow_failure: true
