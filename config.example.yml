# Database configuration
# Supported drivers: "sqlite" (default), "postgres"
database:
  driver: sqlite
  sqlite:
    path: "db/database.sqlite3"
  # postgres:
  #   host: localhost
  #   port: 5432
  #   user: blossom
  #   password: ${POSTGRES_PASSWORD}
  #   database: blossom
  #   ssl_mode: prefer

# Legacy field - use database.sqlite.path instead (backwards compatible)
db_path: "db/database.sqlite3"

# Storage backend configuration
# Supported backends: "local" (default), "s3"
storage:
  backend: local
  local:
    path: "data/blobs"
  # s3:
  #   endpoint: https://s3.example.com  # S3-compatible endpoint
  #   bucket: blossom
  #   region: us-east-1
  #   access_key: ${S3_ACCESS_KEY}
  #   secret_key: ${S3_SECRET_KEY}
  #   path_style: true  # Required for MinIO/Ceph

# Cache configuration (optional)
# Connect to Redis or Dragonfly for shared caching across replicas.
# If not configured, an in-memory cache is used (per-process, not shared).
# cache:
#   url: "redis://dragonfly.dragonfly.svc.cluster.local:6379"
#   ttl: 3600  # Default TTL in seconds (0 = no expiration)

# Storage quota configuration
quota:
  enabled: false
  default_bytes: 1073741824    # 1 GB default quota
  max_bytes: 107374182400      # 100 GB max quota
  warn_threshold: 80           # Warn at 80% usage

# Server-side encryption at rest (optional)
# When enabled, all blobs are encrypted with AES-256-GCM before storage.
# encryption:
#   enabled: true
#   master_key: ${ENCRYPTION_MASTER_KEY}  # 32-byte hex (generate: openssl rand -hex 32)

# CDN integration (optional)
# Configure content delivery for better performance and reduced bandwidth costs.
# Supports Cloudflare R2, AWS CloudFront, or any S3-compatible CDN.
# cdn:
#   enabled: true
#
#   # Public URL for direct CDN access (e.g., https://cdn.example.com)
#   # Used when bucket is publicly accessible via CDN
#   public_url: "https://cdn.example.com"
#
#   # Use presigned URLs for private bucket access
#   # Generates time-limited signed URLs for secure downloads
#   presigned_urls: false
#
#   # Presigned URL expiry duration (e.g., "1h", "24h", "7d")
#   # Default: 1h
#   presigned_expiry: "1h"
#
#   # Redirect to CDN instead of proxying content
#   # true: Returns 302 redirect to CDN URL (saves bandwidth)
#   # false: Proxies content through the API (maintains control)
#   redirect: true
#
#   # Cache-Control header for CDN-served content
#   # Default: "public, max-age=31536000" (1 year for immutable content)
#   cache_control: "public, max-age=31536000"

# Rate limiting (optional)
# Protect against abuse with per-IP and per-pubkey rate limits.
# rate_limiting:
#   enabled: true
#
#   # Per-IP limits (for unauthenticated requests)
#   ip:
#     download:
#       requests: 100      # Max blob downloads per window
#       window: "1m"       # Time window
#     upload:
#       requests: 10       # Max uploads per window
#       window: "1m"
#     general:
#       requests: 60       # All other requests
#       window: "1m"
#
#   # Per-pubkey limits (for authenticated requests)
#   pubkey:
#     download:
#       requests: 200
#       window: "1m"
#     upload:
#       requests: 30
#       window: "1m"
#     general:
#       requests: 120
#       window: "1m"
#
#   # Bandwidth limits
#   bandwidth:
#     download_mb_per_minute: 100    # Max MB downloaded per minute
#     upload_mb_per_minute: 50       # Max MB uploaded per minute
#
#   # Pubkeys exempt from rate limiting
#   whitelisted_pubkeys:
#     - "abc123..."

# Video transcoding configuration (optional)
# Configure hardware acceleration for video transcoding.
# transcoding:
#   work_dir: "/tmp/blossom-transcode"  # Directory for temporary files
#   ffmpeg_path: ""                      # Auto-detect if empty
#
#   # Hardware acceleration settings
#   hwaccel:
#     # Type of hardware acceleration to use
#     # Options: "none" (software), "nvenc" (NVIDIA), "qsv" (Intel), "vaapi" (AMD/Intel Linux), "auto"
#     # Default: "none"
#     type: "none"
#
#     # Device path for VAAPI (only used when type is "vaapi")
#     # device: "/dev/dri/renderD128"
#
#     # Encoder preset (varies by encoder)
#     # - NVENC: p1-p7 (p1=fastest, p7=highest quality), default: p4
#     # - QSV: veryfast, faster, fast, medium, slow, slower, veryslow
#     # - libx264: ultrafast, superfast, veryfast, faster, fast, medium, slow, slower, veryslow
#     # preset: "veryfast"
#
#     # Look-ahead frames for NVENC (improves quality, increases memory usage)
#     # look_ahead: 0
#
#   # Example: NVIDIA GPU encoding
#   # hwaccel:
#   #   type: "nvenc"
#   #   preset: "p4"      # Balanced speed/quality
#   #   look_ahead: 20    # Higher quality B-frame decisions
#
#   # Example: Intel Quick Sync Video
#   # hwaccel:
#   #   type: "qsv"
#   #   preset: "medium"
#
#   # Example: VAAPI (AMD GPU or Intel on Linux)
#   # hwaccel:
#   #   type: "vaapi"
#   #   device: "/dev/dri/renderD128"

# Federation configuration (optional)
# Enable Nostr-based cross-server blob discovery and mirroring.
# Uses kind 1063 (NIP-94 file metadata) and kind 10063 (BUD-03 server list) events.
# federation:
#   enabled: true
#
#   # Federation mode:
#   # - "publish": Only publish blob events to relays
#   # - "subscribe": Only subscribe to events from relays
#   # - "both": Full federation (publish and subscribe)
#   mode: "both"
#
#   # Server's Nostr private key (nsec or hex format)
#   # Used to sign published events. Generate with: npx nostr-tools keygen
#   server_nsec: ${FEDERATION_NSEC}
#
#   # Nostr relays to connect to for federation
#   relay_urls:
#     - "wss://relay.damus.io"
#     - "wss://nos.lol"
#     - "wss://relay.nostr.band"
#
#   # Auto-mirror popular blobs from other servers
#   # When enabled, blobs referenced by multiple users are automatically mirrored locally
#   auto_mirror: true
#
#   # Minimum number of user references before auto-mirroring a blob
#   # Higher values reduce storage but may miss less popular content
#   mirror_min_refs: 2
#
#   # Number of worker goroutines for async publishing/mirroring
#   worker_count: 4
#
#   # Number of events to process in each batch
#   batch_size: 50
#
#   # Retry settings for failed operations
#   retry_attempts: 3
#   retry_delay: "5s"

# Blob expiration (optional)
# When enabled, the server honors the X-Expiration upload header (an absolute
# Unix timestamp, in seconds, NIP-40 style) and runs a background worker that
# deletes blobs once they expire. Clients set the expiry per-upload; the header
# is also advertised via /.well-known/blossom (features.blob_expiration).
# expiration:
#   enabled: true
#
#   # How often the cleanup worker scans for expired blobs (default: 1h)
#   cleanup_interval: "1h"
#
#   # Maximum number of blobs deleted per cleanup run (default: 1000)
#   batch_size: 1000
#
#   # Grace period to wait after expiry before actually deleting (default: 0s)
#   grace_period: "0s"

# Garbage collection (optional)
# When enabled, a background worker periodically reconciles storage by deleting
# "ownerless" blobs — blobs left with no blob_references row (e.g. a crash
# between the ref-count decrement and the row delete, or a legacy expiry path).
# The delete is guarded: a blob that regains an owner before the sweep runs is
# skipped, never destroyed. At most one sweep runs at a time across all replicas
# (a Postgres advisory lock; no leader election needed). Deletion is DESTRUCTIVE,
# so the worker is OFF by default and must be explicitly enabled per deployment.
# The GET /admin/api/gc/report (read-only) and POST /admin/api/gc/reconcile
# (dry-run unless ?confirm=true) endpoints remain available as manual supplements.
# gc:
#   enabled: true
#
#   # How often the reconcile worker runs (default: 1h)
#   interval: "1h"
#
#   # Maximum number of ownerless blobs deleted per run (default: 1000)
#   batch_size: 1000

# Payment configuration (optional, BUD-07)
# Enable paid uploads via Lightning Network or Cashu ecash.
# payment:
#   enabled: true
#
#   # Pricing: satoshis per byte
#   # 0.000001 = 1 sat per megabyte (default)
#   # 0.00001 = 10 sats per megabyte
#   satoshis_per_byte: 0.000001
#
#   # Minimum payment amount (to avoid dust payments)
#   min_payment_sats: 1
#
#   # Free tier: bytes allowed before payment required
#   # Set to 0 to disable free tier
#   # 104857600 = 100 MB free per user
#   free_bytes_limit: 104857600
#
#   # Payment request expiry in minutes
#   request_expiry_mins: 30
#
#   # Lightning Network (LND REST API) configuration
#   lightning:
#     enabled: true
#     lnd_host: "localhost"
#     rest_port: 8080                              # LND REST port (default: 8080)
#     tls_cert_path: "/path/to/tls.cert"           # Optional, skips verify if not set
#     macaroon_path: "/path/to/invoice.macaroon"   # Path to macaroon file
#     macaroon_hex: ""                             # Or hex-encoded macaroon (for env vars)
#     invoice_memo: "Blossom Upload"
#     insecure: false                              # Use HTTP instead of HTTPS
#
#   # Cashu ecash configuration
#   cashu:
#     enabled: true
#     mint_urls:
#       - "https://mint.minibits.cash/Bitcoin"
#       - "https://mint.coinos.io"

# Tier-aware upload enforcement (optional, Cloistr platform mode)
#
# Capability is NEVER paywalled — tiers scale limits, not access.
# Defaults to disabled so self-hosters run unrestricted out of the box.
# When enabled, the detected MIME type (magic-byte based, never the client's
# Content-Type header) and file size are validated against the user's tier.
#
# Tier resolution:
#   - platform mode : calls get_user_tier() in the shared PostgreSQL database
#   - standalone    : every user is treated as "named" regardless
#
# Zero values within a tier config mean "no additional restriction":
#   - max_file_bytes: 0    → falls back to global max_upload_size_bytes
#   - allowed_type_prefixes: [] → unrestricted (global allowed_mime_types applies)
#   - uploads_per_day: 0   → no per-day cap
#
# upload_limits:
#   enabled: true
#
#   # Anonymous: NIP-07 / extension login or auto-assigned address only.
#   # 100 MB storage floor; restricting uploads/day closes the sybil-key abuse hole.
#   anonymous:
#     max_file_bytes: 104857600        # 100 MB
#     allowed_type_prefixes:
#       - "image/"
#       - "video/"
#       - "audio/"
#       - "application/pdf"
#     uploads_per_day: 10
#
#   # Named: has claimed a real (non-auto-assigned) address.
#   named:
#     max_file_bytes: 1073741824       # 1 GiB
#     allowed_type_prefixes:
#       - "image/"
#       - "video/"
#       - "audio/"
#       - "application/pdf"
#     uploads_per_day: 100
#
#   # Paid: holds a non-expired quota grant or active subscription.
#   # No per-day cap; larger file ceiling. Adjust max_file_bytes as needed.
#   paid:
#     max_file_bytes: 5368709120       # 5 GiB
#     allowed_type_prefixes:
#       - "image/"
#       - "video/"
#       - "audio/"
#       - "application/pdf"
#       - "application/"
#     uploads_per_day: 0              # 0 = no daily cap

# Remote media mirror (optional)
#
# THE PROBLEM. Custom emoji (NIP-30) and other remote media are URLs to images
# on hosts we do not control. Rendering them directly discloses the viewer's IP
# address -- and the moment they viewed -- to whoever published the emoji set.
# The alternative most clients take is not rendering them, which makes an emoji
# picker that shows `:blobcatpeek:` as text and cannot be used to pick emoji.
#
# THE ANSWER, which every major email client converged on: fetch server-side,
# store, and serve from our own domain. The user sees images with no banner and
# no decision; the remote host sees this server's address and never learns who
# viewed what.
#
# Mirrored objects become ordinary content-addressed blobs, so they deduplicate
# across every user who has that emoji and are retrievable at GET /<sha256>.
#
# DISABLED BY DEFAULT: this makes outbound HTTP requests on behalf of callers,
# which is not a behaviour to acquire silently on an upgrade.
# media_mirror:
#   enabled: true
#
#   # HMAC key for mirror links. REQUIRED when enabled -- the server refuses to
#   # start without it, because a mirror that serves any URL it is handed is an
#   # open proxy for the whole internet. At least 32 bytes.
#   # Generate with: openssl rand -hex 32
#   #
#   # NEVER ship this key to a browser. Our apps are static SPAs, so anything
#   # they hold is readable in devtools; they obtain signed links from
#   # POST /media/mirror/sign instead, which is behind Nostr auth.
#   signing_key: ${MEDIA_MIRROR_SIGNING_KEY}
#
#   # How long a minted link stays valid. "0" (the default) means never: the
#   # content is immutable, so a link that stops working only breaks
#   # already-rendered pages. Rotate signing_key to revoke.
#   signature_ttl: "0s"
#
#   # Per-object caps. Emoji are small; a 40MB "emoji" should be refused, not
#   # cached.
#   max_object_bytes: 1048576   # 1 MiB
#
#   # Decompression-bomb guards. A few hundred bytes of PNG can declare
#   # 60000x60000 and cost ~14GB to decode, so dimensions are read from the
#   # image header and checked before anything is decoded.
#   max_pixels: 4194304         # 4 Mpx (e.g. 2048x2048)
#   max_dimension: 1024
#
#   # Types that may be mirrored, matched against the type detected from the
#   # BYTES -- never the Content-Type the remote host claims.
#   allowed_mime_types:
#     - image/png
#     - image/jpeg
#     - image/gif
#     - image/webp
#
#   fetch_timeout: "10s"
#   max_redirects: 3
#   max_sign_batch: 256
#
#   # Bounded cache. Potato-grade rule: assume a self-hoster on a Raspberry Pi.
#   # When the total exceeds cache_max_bytes, least-recently-accessed entries
#   # are evicted down to cache_low_water_percent of the cap (draining to
#   # exactly the cap would evict once per request forever).
#   cache_max_bytes: 1073741824      # 1 GiB
#   cache_low_water_percent: 90
#   evict_interval: "10m"
#
#   # Negative caching, so a dead host is not re-fetched on every page view.
#   # "unreachable" is transient and retried sooner; "refused" depends on our
#   # policy and the content, so it is remembered longer -- but not forever, or
#   # a policy change would never take effect.
#   negative_ttl: "15m"
#   refused_ttl: "24h"
#
#   # SSRF protection. Destinations are checked AFTER DNS resolution, at dial
#   # time, on every redirect hop -- which is what closes DNS rebinding and
#   # redirect-to-metadata. Private, loopback, link-local, CGNAT and NAT64
#   # ranges are refused by default.
#   #
#   # allow_private_addresses DISABLES that. It exists for a self-hoster
#   # mirroring from their own LAN and is dangerous on a public deployment:
#   # anyone holding a signed link could point the server at 169.254.169.254 or
#   # an internal service.
#   allow_private_addresses: false
#
#   # Extra ranges to refuse, e.g. a provider metadata endpoint on a
#   # public-looking address. A malformed entry fails startup rather than being
#   # ignored -- a deny rule that is silently dropped is a hole that looks like
#   # a fence.
#   extra_denied_cidrs: []
#
#   # Pubkey that owns mirrored blobs. Mirrored content belongs to the server,
#   # not to whoever first caused it to be fetched: attributing it to a user
#   # would both charge their quota and record that they viewed it. Defaults to
#   # a synthetic marker key that no one holds the private key for.
#   # owner_pubkey: ""

# Log level, adjust accordingly.
log_level: "TRACE"

# Address where server will be listening.
api_addr: "0.0.0.0:8000"

# URL that will be used as the base for the URL to serve files.
#
# This setting is meant to be tweaked if you are running the server
# behind a reverse proxy (like nginx) and you want a subdomain.
# You could set it to: `https://my.domain.com` and then the files
# would be served at `https://my.domain.com/<hash>`
cdn_url: "http://0.0.0.0:8000"

# Admin pubkey
admin_pubkey: "509f37d850fa007227688f2d897e8e8efb6af9a4b2bd636bbd74349f9f2c6d89"

# Limit the size of files that can be uploaded, specified in bytes.
# Default value of 2MB
max_upload_size_bytes: 2097152

# Control the behavior of the Blossom server.
# Available actions:
# - 'ALLOW'
# - 'DENY'
#
# Available resources:
# - 'UPLOAD': upload a file to the server
# - 'GET': get a file from the server
# - 'DELETE': delete a file from the server
# - 'LIST': list the files of a pubkey
# - 'MIRROR': upload a file from another Blossom server
#
# Available pubkey options:
# - 'ALL': rule applies to any pubkey
# - '<specific-pubkey>': rule applies to only one pubkey
access_control_rules:
  - action: "ALLOW"
    pubkey: "ALL"
    resource: "UPLOAD"
  - action: "ALLOW"
    pubkey: "ALL"
    resource: "GET"

# Control the type of files that are accepted by the server.
# For the supported types, check: https://github.com/gabriel-vasile/mimetype/blob/master/supported_mimes.md
# 
# To allow any mime-type, only set one rule:
# - *
allowed_mime_types:
  - image/jpeg
  - image/png
